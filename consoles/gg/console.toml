# Sega Game Gear. A project may override any key from disk.
colour_bits = 4
channel_step = 16
export_palette = "gg"

tile = [8, 8]
hw_cell = [8, 16]        # 8x8 or 8x16 (VDP register 1), one size for all sprites
hw_cells_max = 64        # SAT: 64 sprites
hw_cells_per_row_max = 8 # 8 sprites per scanline
palettes = 2             # two 16-colour palettes; a BG tile picks either
obj_palettes = 1         # sprites always use the second palette; entry 0 is transparent
colors = 15
colors_per_tile = 16
vram_banks = 1
vram_tiles_per_bank = 448 # 16 KB minus the 0x700-byte name table and the 0x100-byte sprite table = 14336 bytes / 32 (derived)
obj_tiles_max = 256       # sprites use the first or the second 256 tiles
bg_tiles_max = 448
sprite_cells = 128        # 256 tiles / 2 (8x16 cells): a ceiling; streaming budgets are not modelled (R6)
window_tiles = 0
dma_bytes_per_frame = 0   # not modelled
vram_share = false
dedupe_flips = true       # BG tiles have flip bits
sheet_width = 128

[style]
# design-language hints read by skills, the automatic first version and the quality harness; a project [style] overrides them
white = "highlights"
outline = "darkest"
min_value_spread = 0.5
value_map = "colour"
reason = "Game Gear has 4 bits per channel and a small screen: hues first, white for highlights and eyes."

[console]
name = "Sega Game Gear"
short = "GG"
screen = [160, 144]
preview_bg = "#000000"
colour = "4096 colours, 4 bits per channel (0000BBBB GGGGRRRR); the 8-bit value is the nibble times 16"
palettes = "2 palettes of 16 colours (32 entries on screen, CRAM 64 bytes): BG and sprites; sprite entry 0 is transparent"
oam = "64 sprites per frame, 8 per scanline, 8x8 or 8x16 (one size for all)"
vram = "16 KB = 512 tile slots of 32 bytes; about 448 for artwork after the name table and sprite table"
references = ["SMS Power Palette (smspower.org/Development/Palette): on the Game Gear SMS mode 4 behaves like the SMS; colour entries are written as two bytes (even address latched)", "12-bit colour (4096 colours, 32 on screen) and %0000BBBB %GGGGRRRR entries: secondary source (chibiakumas.com/z80/MasterSystemGameGear.php and Wikipedia), not SMS Power", "visible area 160x144 centred in the 256x192 VDP buffer: secondary (same source); sprites, tiles and VRAM as the SMS"]
