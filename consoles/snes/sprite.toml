# SNES sprites (image mode "sprite"). Inherits console.toml.
shared_palette = true
overlays = "allow"     # a second colour layer is a second sprite on the same cells; the sprite limits count it

[mode]
description = "OBJ sprites: two sprite sizes of one OBSEL pair (default 16x16 / 32x32), 15 colours plus transparent per palette, 128 per frame, 32 and 272 pixels per scanline"
