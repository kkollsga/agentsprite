# GB sprites (image mode "sprite"). Inherits console.toml.
shared_palette = true
overlays = "allow"     # a second colour layer is a second sprite on the same cells; the sprite limits count it

[mode]
description = "OBJ sprites: 8x16 cells, 3 shades plus transparent per palette (2 palettes), 40 per frame, 10 per scanline"
