# Game Boy Color background tiles. DESIGN 5.5, 5.6a.
tile = [8, 8]
colors_per_tile = 4
palettes = 8
transparent = false
unique_tiles_max = 348   # level tiles + animated tile slots
count_animated = true
anim_slots = "per_frame" # "all_frames": frames x tiles per animation set
pattern_unique = true    # same 2-bit index pattern (flips) with another palette is the same tile
bg_reserved = [7]        # BG palette 7 is kept for HUD and text
dedupe_flips = true
sheet_width = 128
channel_step = 8
window_tiles = 64         # HUD / text / card tiles of the reserved palette
vram_banks = 2
vram_tiles_per_bank = 384
vram_share = true
obj_tiles_max = 512
bg_tiles_max = 512
