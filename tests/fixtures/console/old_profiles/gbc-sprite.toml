# Game Boy Color sprites. DESIGN 5.5.
colors = 3            # per layer, plus transparent
shared_palette = true
channel_step = 8
hw_cell = [8, 16]
hw_cells_warn = 12
hw_cells_per_row_warn = 5
hw_cells_per_row_max = 10 # hard limit (error): sprites per scanline band
hw_cells_max = 40            # hard limit (error): sprites per frame

# Shared hardware resources (M5 T5): checked per scene by `pxl check` and `pxl scene`.
obj_palettes = 8          # OBJ palettes, 3 colours + transparent (the sprite palette set of a scene)
vram_banks = 2
vram_tiles_per_bank = 384
sprite_cells = 178        # sprite VRAM in 8x16 cells: resident groups + double-buffered streamed groups
vram_share = true         # BG tiles a scene does not use may hold sprite cells (0x8800-0x8FFF is addressable by both)
vram_shared_tiles = 256   # tiles in that block over both banks
obj_tiles_max = 512       # OBJ addresses 0x8000-0x8FFF: 256 tiles per bank
bg_tiles_max = 512        # BG (8800 mode) addresses 0x8800-0x97FF incl. the window: 256 per bank
dma_bytes_per_frame = 1024 # streamed groups: changed cells x 32 bytes between consecutive frames
overlays = "category"     # overlay (detail) layers are errors ...
overlay_categories = ["player"] # ... except for these categories ...
overlay_cap = 2           # ... with at most this many overlay cells per frame

# Palette-set parts (shared per-cell palettes): category defaults of the hardware feedback of 2026-10-14.
# A part picks its category (`category = "enemy"`) and may override with `[budget] per_line = .., per_frame = ..`.
category = "item"        # category of a part that declares none
multi_slot_max = 2       # player: cells per frame that may need two slots (each costs 2 sprites)

[budget.player]
per_line = 4
per_frame = 7
overlay_line = 5         # a line that carries a two-slot cell may hold 5
[budget.enemy]
per_line = 4
per_frame = 8
[budget.item]
per_line = 3
per_frame = 6
[budget.hazard]
per_line = 3
per_frame = 6
[budget.effect]
per_line = 3
per_frame = 6
[budget.platform]
per_line = 6
per_frame = 16
[budget.scenery]
per_line = 2
per_frame = 20
[budget.boss]
per_line = 6
per_frame = 24
[budget.screen]
per_line = 10
per_frame = 30
