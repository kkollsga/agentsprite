name: Release

# Publishes prebuilt binaries to a GitHub Release on a version-tag push (git tag v0.1.0 && git push --tags).
# There is no crates.io or PyPI publish: pxl is distributed only as binaries (Cargo.toml has publish = false).
#
# A `v*` TAG PUSH IS THE ONLY TRIGGER, deliberately. On a manual dispatch GITHUB_REF_NAME is a branch, so archives
# would be named pxl-main-<target> and the release step would create a release named after the branch, all green.
# `Guard the publish ref` (scripts/release_gates.sh assert_publish_ref) is the backstop in every job that names a file
# after the ref. Re-run a failed release with "Re-run jobs" on the tag's own run, which keeps GITHUB_REF_TYPE=tag.
#
# The fragile logic lives in scripts/release_gates.sh, which ci.yml unit-tests on every push, because nothing written
# inline here can ever be exercised by branch CI.
#
# Linux binaries are built for musl (static): pxl is pure Rust, so a musl build has no libc dependency and runs on
# any distribution, old or new, and in Alpine/scratch containers, where a gnu build would be tied to the glibc of
# the build runner.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gates.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Guard the publish ref
        shell: bash
        run: |
          scripts/release_gates.sh assert_publish_ref \
            "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE" "$GITHUB_EVENT_NAME"
      - name: Check version, plugin version and changelog
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/release_gates.sh extract_version Cargo.toml)
          scripts/release_gates.sh assert_version_shape "$version"
          scripts/release_gates.sh assert_tag_matches_manifest "$version" "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE"
          scripts/release_gates.sh assert_plugin_version "$version" .claude-plugin/plugin.json
          scripts/release_gates.sh changelog_notes "$version" CHANGELOG.md "$RUNNER_TEMP/notes.md" "$GITHUB_REF_TYPE"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [gates]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # LOAD-BEARING: with the default fail-fast, one red leg cancels its siblings. The artifact gate in the release
      # job then reports which target is missing instead of the run showing three cancelled legs.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Guard the publish ref
        shell: bash
        run: |
          scripts/release_gates.sh assert_publish_ref \
            "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE" "$GITHUB_EVENT_NAME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive=$(scripts/release_gates.sh archive_name "$GITHUB_REF_NAME" "$TARGET")
          mkdir -p out stage
          cp "target/$TARGET/release/pxl" LICENSE README.md stage/
          tar -C stage -czf "out/$archive" pxl LICENSE README.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd out && sha256sum "$archive" > "$archive.sha256")
          else
            (cd out && shasum -a 256 "$archive" > "$archive.sha256")
          fi
          cat "out/$archive.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $archive = "pxl-$env:GITHUB_REF_NAME-$env:TARGET.zip"
          New-Item -ItemType Directory -Force -Path out, stage | Out-Null
          Copy-Item "target/$env:TARGET/release/pxl.exe", LICENSE, README.md stage/
          Compress-Archive -Path stage/pxl.exe, stage/LICENSE, stage/README.md -DestinationPath "out/$archive"
          $hash = (Get-FileHash "out/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "out/$archive.sha256" -Encoding ascii
          Get-Content "out/$archive.sha256"
      - name: Smoke test the binary
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          exe="target/$TARGET/release/pxl"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" console list
      - uses: actions/upload-artifact@v7
        with:
          name: pxl-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Attach to the GitHub Release
    needs: [gates, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Guard the publish ref
        shell: bash
        run: |
          scripts/release_gates.sh assert_publish_ref \
            "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE" "$GITHUB_EVENT_NAME"
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: pxl-*
          merge-multiple: true
      # Exactly one archive and one checksum per matrix leg, nothing else: a partial set is never attached.
      - name: Check the artifact set
        shell: bash
        run: scripts/release_gates.sh assert_artifact_set out "$GITHUB_REF_NAME"
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ needs.gates.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release_gates.sh changelog_notes "$VERSION" CHANGELOG.md notes.md "$GITHUB_REF_TYPE"
      # Idempotent: a re-run updates the existing release and replaces its assets.
      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "pxl $GITHUB_REF_NAME" --notes-file notes.md
          fi
