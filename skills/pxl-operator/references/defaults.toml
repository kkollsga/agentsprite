# Operator defaults and questions: shared by the pxl-operator skill and `pxl intake` (the binary embeds this file).
# Edit here to tune the operator; `pxl intake` reads the lists and the question texts at run time.
# Every default is an ASSUMPTION: recorded in decisions.md with --by operator, reversible with
#   pxl decide "why" --set key=value

[defaults]
# Trade-off order when the hardware does not fit: first item is given up first.
tradeoff = ["cut animation steps", "fold colours", "narrow sizes", "convert to BG", "counter-propose to the client"]
fidelity_options = ["faithful", "reinterpreted"]
fidelity = "faithful"            # users of earlier projects wanted source-pixel fidelity
cadence_options = ["as_work_lands", "per_batch", "daily", "weekly"]
cadence = "as_work_lands"        # send images as work lands, without waiting for feedback
exceptions = "never"             # never ask the client for a hardware exception; fix within the limits
reviewer_approves = "assets"     # the user approves the plan, the design language and decisions
delivery = "package/ with manifest, DELIVERY.md"

# What the operator infers (and from where). Nothing here is asked.
[infer]
console = "request text, then client spec (spec.json 'console'), then the project setting"
fidelity = "wording of the request ('faithful', 'redraw', ...) and the reference material"
identity_list = "detected eyes, saturated small-area colours and material ramps of the ingested inputs"
cadence = "'daily', 'weekly', 'in batches' in the request"
tradeoff = "defaults above; 'keep all animation' moves 'cut animation steps' to the end"
deadline = "an ISO date (YYYY-MM-DD) in the request"

# The only questions the operator may open. Each is a decision with options, an image and a recommendation.
# Ask a question only when it is high-impact AND cannot be inferred. At most a few per batch.
[[question]]
topic = "which console is the target"
when = "the request names a console other than the project's"
recommend = "B"
why = "the request names {other} but the project is set to {project}; art made for the wrong console is redone"
options = { A = "keep {project} (the project setting)", B = "switch to {other} (named in the request: `pxl console set {other}`)" }

[[question]]
topic = "style direction"
when = "the request is about look/style/mood but says neither faithful nor reinterpreted, or says both"
recommend = "A"
why = "source fidelity is what users of earlier projects loved, and it is the cheaper path to a feasible first version"
options = { A = "faithful: keep the source pixels, shapes and colours as far as the hardware allows", B = "reinterpreted: redraw in the console's own look, keeping identity colours and features" }

# Questions to ask only if the situation arises (not generated by `pxl intake`; the operator opens them with `pxl ask`).
[[question]]
topic = "plan does not fit"
when = "pxl plan reports an infeasible scene"
recommend = "the cheapest option that keeps identity colours and animation reads"
why = "show the fit table; the user decides once, in one batch"
options = { A = "cut animation steps", B = "fold colours", C = "narrow sizes", D = "convert objects to BG", E = "counter-propose to the client" }

[[question]]
topic = "palette mood per scene"
when = "the palette plan has real alternatives (vivid vs muted, warm vs cool)"
recommend = "the option closest to the source palette"
why = "show swatches rendered on a source frame; a mood is a taste decision, not a hardware fact"
options = { A = "closest to the source", B = "more muted", C = "more vivid" }
